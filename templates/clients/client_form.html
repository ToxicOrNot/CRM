{% extends "base.html" %}

{% block title %}{{ page_title }} | CRM{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <h1 class="h3 mb-0">{{ page_title }}</h1>
    <a href="{% url 'clients:list' %}" class="btn btn-outline-secondary">К списку</a>
</div>

<form method="post" class="bg-white border rounded-2 p-3" novalidate>
    {% csrf_token %}
    {% include "clients/includes/client_form_fields.html" %}
    <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
        {% if client.pk %}
            <a href="{{ client.get_absolute_url }}" class="btn btn-outline-secondary">Отмена</a>
        {% else %}
            <a href="{% url 'clients:list' %}" class="btn btn-outline-secondary">Отмена</a>
        {% endif %}
    </div>
</form>
{% endblock %}
